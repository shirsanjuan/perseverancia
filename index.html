<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perseverance en Marte</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
    #info {
      position: fixed; top: 12px; left: 12px; color: #fff;
      font: 14px sans-serif; text-shadow: 0 1px 3px #000;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">Perseverance en Marte · arrastra para rotar, rueda para acercar</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- Escena y cielo anaranjado ---
    const scene = new THREE.Scene();
    const colorCielo = 0xd9955f;
    scene.background = new THREE.Color(colorCielo);
    scene.fog = new THREE.Fog(colorCielo, 40, 220);

    // --- Cámara ---
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(8, 5, 12);

    // --- Renderizador ---
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // --- Luces ---
    scene.add(new THREE.HemisphereLight(0xffd2a8, 0x8a4a2b, 0.6));

    const sol = new THREE.DirectionalLight(0xfff0dd, 1.6);
    sol.position.set(30, 40, 20);
    sol.castShadow = true;
    sol.shadow.mapSize.set(2048, 2048);
    Object.assign(sol.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 120 });
    scene.add(sol);

    // --- Suelo de Marte ---
    const suelo = new THREE.Mesh(
      new THREE.PlaneGeometry(600, 600, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0xa8532e, roughness: 1 })
    );
    suelo.rotation.x = -Math.PI / 2;
    suelo.receiveShadow = true;
    scene.add(suelo);

    // --- Rover Perseverance (el frente apunta a +Z) ---
    const rover = new THREE.Group();
    const ruedas = []; // grupos que giran sobre el eje X (para animarlas después)

    const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.3, ...extra });
    const matChasis = mat(0xd8d8d8);
    const matOscuro = mat(0x2a2a2a, { roughness: 0.9, metalness: 0.1 });
    const matMetal = mat(0x9a9a9a);

    function caja(w, h, d, material, x, y, z, padre = rover) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      m.position.set(x, y, z);
      padre.add(m);
      return m;
    }
    function cilindro(rArriba, rAbajo, largo, material, x, y, z, rot = [0, 0, 0], padre = rover) {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(rArriba, rAbajo, largo, 20), material);
      m.position.set(x, y, z);
      m.rotation.set(...rot);
      padre.add(m);
      return m;
    }

    // Chasis (caja principal + cubierta superior)
    caja(1.9, 0.6, 3, matChasis, 0, 1.15, 0);
    caja(1.7, 0.12, 2.8, mat(0xb8b8b8), 0, 1.51, 0);

    // RTG (generador) en la parte trasera
    cilindro(0.22, 0.22, 1.1, matOscuro, 0, 1.45, -1.9, [Math.PI / 2, 0, 0]);
    for (let i = 0; i < 4; i++) caja(0.7, 0.05, 0.08, matMetal, 0, 1.45, -1.55 - i * 0.28);

    // Seis ruedas con sus ejes (3 por lado)
    const rueda = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 24);
    const cubo = new THREE.CylinderGeometry(0.2, 0.2, 0.44, 12);
    for (const lado of [-1, 1]) {
      for (const z of [-1.3, 0, 1.3]) {
        const pivote = new THREE.Group();
        pivote.position.set(lado * 1.25, 0.5, z);
        const llanta = new THREE.Mesh(rueda, matOscuro);
        llanta.rotation.z = Math.PI / 2;
        const centro = new THREE.Mesh(cubo, matMetal);
        centro.rotation.z = Math.PI / 2;
        // marcas en la banda de rodadura para que se note el giro
        for (let i = 0; i < 6; i++) {
          const marca = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.08, 0.14), matMetal);
          const a = (i / 6) * Math.PI * 2;
          marca.position.set(0, Math.sin(a) * 0.5, Math.cos(a) * 0.5);
          marca.rotation.x = a;
          pivote.add(marca);
        }
        pivote.add(llanta, centro);
        rover.add(pivote);
        ruedas.push(pivote);
        // brazo de suspensión hacia el chasis
        caja(0.8, 0.1, 0.1, matMetal, lado * 1.0, 0.85, z);
      }
    }
    // Eje longitudinal de suspensión
    for (const lado of [-1, 1]) caja(0.1, 0.1, 2.8, matMetal, lado * 0.95, 0.85, 0);

    // Mástil con cámara (Mastcam-Z), delante a la izquierda
    const mastil = new THREE.Group();
    mastil.position.set(0.55, 1.57, 1.0);
    cilindro(0.06, 0.07, 1.3, matMetal, 0, 0.65, 0, [0, 0, 0], mastil);
    caja(0.7, 0.3, 0.3, matChasis, 0, 1.4, 0, mastil);
    for (const x of [-0.18, 0.18]) {
      cilindro(0.08, 0.08, 0.12, mat(0x111111), x, 1.4, 0.2, [Math.PI / 2, 0, 0], mastil);
    }
    rover.add(mastil);

    // Brazo robótico, al frente: dos tramos y una torreta con herramientas
    const brazo = new THREE.Group();
    brazo.position.set(-0.4, 1.0, 1.5);
    caja(0.14, 0.14, 0.9, matMetal, 0, 0, 0.45, brazo);
    const codo = new THREE.Group();
    codo.position.set(0, 0, 0.9);
    codo.rotation.x = 0.5;
    cilindro(0.1, 0.1, 0.2, matChasis, 0, 0, 0, [0, 0, Math.PI / 2], codo);
    caja(0.12, 0.12, 0.8, matMetal, 0, 0, 0.4, codo);
    cilindro(0.2, 0.2, 0.25, matOscuro, 0, 0, 0.9, [Math.PI / 2, 0, 0], codo);
    brazo.add(codo);
    rover.add(brazo);

    // Antena de alta ganancia (disco pequeño)
    cilindro(0.04, 0.04, 0.5, matMetal, -0.6, 1.8, -0.7);
    cilindro(0.3, 0.3, 0.04, matChasis, -0.6, 2.08, -0.7, [0.3, 0, 0]);

    rover.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    scene.add(rover);

    // --- Controles de cámara ---
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // no bajar del suelo
    controls.minDistance = 3;
    controls.maxDistance = 60;

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
